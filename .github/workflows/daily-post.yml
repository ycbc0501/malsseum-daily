name: Daily 말씀 Reel

# Two posts a day: 05:00 KST and 19:00 KST. ONE cron per slot — it fires, and daily_post.py
# posts right then, whatever time that actually is. (RULES.md C2, simplified 2026-11-10.)
#
# History: 2026-08-28 GitHub's scheduler drifted up to 4-5 hours late, and the design at the
# time (one cron fired 2h early + an in-job sleep to the exact target) meant a big delay sent
# the post out at a near-random hour — 19:00 KST landed at 21:30, 22:35, 10:28, reach fell from
# ~350 views to ~50 and stayed there. The fix tried then was a CHAIN of 10 hourly crons (5 per
# slot) racing to claim the slot inside a sliding window, which absorbed the drift but was
# itself a source of bugs for two months straight: two runs claiming the same window at once
# and double-posting (2026-09-06), "late" vs "on-time" claims disagreeing about their own
# deadline so NOBODY claimed (2026-09-13/14), a carousel on another workflow being miscounted
# as filling the slot. None of that bookkeeping changes WHEN GitHub actually runs the job — only
# how the chain argues about it. So it is gone: one cron per slot, post the moment it fires. A
# post landing late because GitHub ran late is normal now, not an error to route around.
# slot_already_filled() (daily_post.py) still guards against posting the same half-day twice.
#   morning → target 05:00 KST = 20:00 UTC, cron "0 20 * * *"
#   evening → target 19:00 KST = 10:00 UTC, cron "0 10 * * *"
on:
  schedule:
    - cron: "0 20 * * *"
    - cron: "0 10 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Publish immediately, ignoring the duplicate-slot check (use to fill a missed post)"
        type: boolean
        default: false

# Cheap insurance against an overlapping manual dispatch, not a scheduling mechanism — with one
# cron per slot there is no chain left to serialise. cancel-in-progress: false — never kill a
# run that might already be mid-publish.
concurrency:
  group: daily-post-${{ contains(fromJSON('["0 10 * * *"]'), github.event.schedule) && '19' || '5' }}
  cancel-in-progress: false

permissions:
  contents: write
  issues: write

jobs:
  post:
    runs-on: ubuntu-latest
    # TIMING BUDGET — there is no more in-job wait (2026-11-10), so this only has to cover the
    # build itself: image + gates/regens, Veo + retry, Lyria, ffmpeg, release upload, IG publish.
    # Measured build time is ~50 min; this leaves real headroom for a slow day's retries without
    # reintroducing the old "sized to the happy path, dies mid-render on a bad one" failure.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        # higgsfield-client stays: fetch_image.py's Soul fallback for stills still uses it.
        # requests added 2026-11-09: fetch_motion.py now calls Gemini Omni's Interactions API
        # through it (plain urllib dropped 1/3 large-response downloads mid-transfer — see
        # fetch_motion.py's module docstring).
        run: pip install pillow higgsfield-client requests "kiwipiepy==0.24.1" imageio-ffmpeg

      # notes/reference-study/style_refs/ (RULES.md D-6) is gitignored — reference-study.yml is
      # the only WRITER, via the Actions cache (not git, not a Release: see that workflow's own
      # comment on why — another account's copyrighted photos have no business in anything
      # public-facing). This is a read-only restore: this job never writes the cache back, so a
      # miss here just means fetch_image.py generates exactly as it always has (rule 0-3's shape).
      - name: Restore style-reference images (read-only)
        uses: actions/cache/restore@v4
        with:
          path: notes/reference-study/style_refs
          key: style-refs-${{ github.run_id }}
          restore-keys: |
            style-refs-

      - name: Build the Reel (Nano Banana Pro + music) and post
        id: build
        env:
          # published_refs() and slot_already_filled() run in THIS step and both talk to Instagram.
          # Without these they got access_token=None and every call came back "Cannot parse access
          # token", so the duplicate guards silently fell back to the local ledger — the exact
          # protection they exist to provide has never once been active.
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          HF_API_KEY: ${{ secrets.HF_API_KEY }}
          HF_API_SECRET: ${{ secrets.HF_API_SECRET }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          # One original sentence under the reference (RULES B-5, changed 2026-09-14). Instagram
          # restricted the account's reach as 퍼온 콘텐츠 while flagging posts hours old and wholly
          # generated by us, and tapping a flagged post names NO other creator — so the match is
          # not the video. The caption was the one place this account owned no text at all.
          CAPTION_REFLECTION: "1"
          # A manual run defaults to the 05:00 slot. `force` skips the duplicate-slot check so a
          # missed post can be filled by hand — 2026-09-09's evening reel was lost and there was
          # no way to publish it.
          FORCE: ${{ inputs.force && '--now' || '' }}
          TARGET_HOUR: ${{ contains(fromJSON('["0 10 * * *"]'), github.event.schedule) && '19' || '5' }}
        run: |
          python daily_post.py --emit --hour "$TARGET_HOUR" $FORCE
          # No _skip file means a reel was built and the publish steps should run.
          if [ -f output/_skip ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "this slot was already posted (duplicate guard) — exiting cleanly"
          fi

      - name: Host media on a GitHub Release (keeps git history lean)
        if: steps.build.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          REL="$(cat output/_path.txt)"
          FILE="post-${GITHUB_RUN_ID}.${REL##*.}"   # unique name → never collides/clobbers (IG fetch-safe)
          cp "$REL" "$FILE"
          gh release view media >/dev/null 2>&1 || gh release create media --title media --notes "hosted media"
          gh release upload media "$FILE" --clobber
          # Keep only the 30 newest assets, newest by UPLOAD TIME. This used to be
          # `... '.assets[].name' | sort | head -n -30`, i.e. newest by NAME -- and the names
          # are not one series: reels are `post-<run id>.mp4` and the weekly carousel uploads
          # `carousel-<date>-<n>.png`. Lexicographically every `carousel-` sorts BELOW every
          # `post-`, so once 30 reels existed the carousel's slides were always in the delete
          # set, no matter that they were seconds old. Any daily-post run landing between the
          # carousel's upload and Instagram's fetch of those URLs would pull the images out
          # from under it -- and GitHub fires these crons hours off schedule (RULES.md I-1),
          # so "those two steps are minutes apart" is not something this repo can rely on.
          gh release view media --json assets \
            -q '.assets|sort_by(.createdAt)|.[].name' | head -n -30 \
            | while read -r a; do gh release delete-asset media "$a" -y || true; done
          echo "FILE=$FILE" >> "$GITHUB_ENV"

      # Last line of defence. The build-time check above should make this unreachable, but a
      # duplicate post is the single most expensive thing this pipeline can ship, so the slot is
      # re-checked after the build — seconds before publishing rather than minutes.
      - name: Re-check the slot right before publishing
        id: recheck
        if: steps.build.outputs.skip != 'true'
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          TARGET_HOUR: ${{ contains(fromJSON('["0 10 * * *"]'), github.event.schedule) && '19' || '5' }}
        run: |
          # exit 1 = slot taken (skip), exit 0 = free, anything else = the check itself broke.
          # A broken check must not silently swallow the post — this single check is the real
          # guard now (no more chain/queue behind it), so fall open and publish, loudly.
          set +e
          python -c "import sys, daily_post; sys.exit(1 if daily_post.slot_already_filled(int('$TARGET_HOUR')) else 0)"
          rc=$?
          set -e
          if [ "$rc" -eq 1 ]; then
            echo "another run filled this slot while we were building — not publishing"
            echo "taken=true" >> "$GITHUB_OUTPUT"
          elif [ "$rc" -ne 0 ]; then
            echo "::warning::slot re-check failed (exit $rc) — publishing anyway rather than risk a silent miss"
          else
            echo "slot still free"
          fi

      - name: Publish to Instagram
        if: steps.build.outputs.skip != 'true' && steps.recheck.outputs.taken != 'true'
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
        run: |
          URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/media/${FILE}"
          echo "URL: $URL"
          CMT="$(cat output/_comment.txt)"
          if [[ "$FILE" == *.mp4 ]]; then
            python post_instagram.py "$URL" "$(cat output/_caption.txt)" --reel --comment "$CMT" --story
          else
            python post_instagram.py "$URL" "$(cat output/_caption.txt)" --comment "$CMT" --story
          fi

      # Record what we published, then re-pull insights for recent posts. Reels keep accruing
      # views for over a week, so a single fetch at publish time would freeze a near-zero —
      # `refresh` re-reads everything younger than metrics.MATURE_DAYS on every run.
      # continue-on-error: measurement must never fail a posting run.
      - name: Record performance metrics
        if: steps.build.outputs.skip != 'true' && steps.recheck.outputs.taken != 'true'
        continue-on-error: true
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
        run: |
          python metrics.py record
          python metrics.py refresh
          python metrics.py report

      # The ledger MUST survive, because a lost ledger means the next run re-posts the same
      # verse with the same scene — and Instagram demotes the whole account for duplicates, not
      # just the repeat (2026-08-26 → 잠언 18:10 published twice, reach fell ~6x and stayed down).
      # `if: always()` so a failure in an earlier step can never strand a published post with an
      # unsaved ledger. `git pull --rebase` is gone: these are machine-written JSON one-liners, a
      # concurrent bot push made git conflict on the single line, `|| true` swallowed it and left
      # the repo mid-rebase, and the push died. ledger_merge.py resolves them semantically instead.
      - name: Save no-repeat ledger
        if: always() && steps.build.outputs.skip != 'true'
        # One implementation for every ledger — see save_ledger.sh. The old
        # `git pull --rebase || true; git push` is what lost the 08-26 ledger.
        run: >-
          bash save_ledger.sh 'ledger update' state.json metrics.json
      - name: Alert on a missed post
        if: (failure() || cancelled()) && steps.build.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_THREAD_ID: ${{ secrets.TELEGRAM_THREAD_ID }}
          # watch.py asks Instagram whether the slot is actually empty before it says anything.
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          TARGET_HOUR: ${{ contains(fromJSON('["0 10 * * *"]'), github.event.schedule) && '19' || '5' }}
        run: |
          gh issue create \
            --title "missed post — ${TARGET_HOUR}:00 KST (run ${GITHUB_RUN_ID})" \
            --body "The \`${TARGET_HOUR}:00 KST\` post did not publish.

          Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}

          If the job hit the timeout, check the timing budget comment in
          \`.github/workflows/daily-post.yml\` — the build must fit inside it." \
            || echo "could not open issue"
          # NOT notify.py directly — a failing run knows nothing about the slot (there is no
          # chain to retry it now; this is the only run for this slot today). watch.py asks
          # Instagram first and alerts at most once per slot.
          TARGET_HOUR="${TARGET_HOUR}" python watch.py --post-failed \
            "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            || true
