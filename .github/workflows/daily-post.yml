name: Daily 말씀 Reel

# Two posts a day: 05:00 KST and 19:00 KST (±10 min).
#
# 2026-08-28: GitHub's scheduler drifted from ~30 min late to 4-5 HOURS late. The old design was
# a single cron fired 2h early plus a wait inside the job, so once the drift passed 2h the target
# had already gone by and the post went out whenever the runner started — 19:00 KST landed at
# 21:30, 22:35, 10:28. Reach fell from ~350 views to ~50 and stayed there.
#
# So each slot now has a CHAIN of hourly crons across a 5-hour lead window. daily_post.py exits in
# seconds if it is more than MAX_WAIT_MIN from the target (a later, closer cron takes the slot) and
# posts otherwise, and slot_already_filled() asks Instagram whether this half of the day is already
# posted so the chain can never double-post.
#   morning → target 05:00 KST = 20:00 UTC, crons 15:00-19:00 UTC
#   evening → target 19:00 KST = 10:00 UTC, crons 05:00-09:00 UTC
on:
  schedule:
    - cron: "0 15 * * *"
    - cron: "0 16 * * *"
    - cron: "0 17 * * *"
    - cron: "0 18 * * *"
    - cron: "0 19 * * *"
    - cron: "0 5 * * *"
    - cron: "0 6 * * *"
    - cron: "0 7 * * *"
    - cron: "0 8 * * *"
    - cron: "0 9 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Publish immediately, ignoring the slot window (use to fill a missed post)"
        type: boolean
        default: false

# ONE run per slot, serialised by GitHub itself. On 2026-09-06 the 08:00 cron fired 69 minutes
# late and the 09:00 cron fired 52 minutes late, so BOTH landed inside the 60-minute claim window,
# both slept to 19:00 KST, both asked Instagram whether the slot was taken at the same instant,
# both got "no", and 데살로니가후서 2:17 went out twice five minutes apart. The claim-window proof
# assumed every cron is delayed by the same amount; GitHub delays each one differently, so no
# scheduling rule can make the claim unique. A queue can.
#
# cancel-in-progress: false — the waiting run must not kill the one that is already posting. It
# starts after that run finishes, finds the target long past, and stands down on its own.
concurrency:
  group: daily-post-${{ contains(fromJSON('["0 5 * * *","0 6 * * *","0 7 * * *","0 8 * * *","0 9 * * *"]'), github.event.schedule) && '19' || '5' }}
  cancel-in-progress: false

permissions:
  contents: write
  issues: write

jobs:
  post:
    runs-on: ubuntu-latest
    # TIMING BUDGET — do not shrink below (max wait + max build) or posts die mid-render.
    #   max wait  = cron fires on time (2h early) + jitter +10 min      = 130 min
    #   max build = image + gates/regens, Veo + retry, Lyria, ffmpeg,
    #               release upload, IG publish                          ~ 50 min
    # 2026-07-26: was 60, which was *less than the wait alone* — a late-firing scheduler
    # (03:57 KST instead of 03:00) left only 7 min of build budget and the morning post was
    # killed mid-ffmpeg. Silent miss, twice (07-24, 07-26). Keep this >= 180.
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: pip install pillow higgsfield-client kiwipiepy imageio-ffmpeg

      - name: Wait for target time (05:00 or 19:00 KST ±10), build the Reel (Nano Banana Pro + music)
        id: build
        env:
          # published_refs() and slot_already_filled() run in THIS step and both talk to Instagram.
          # Without these they got access_token=None and every call came back "Cannot parse access
          # token", so the duplicate guards silently fell back to the local ledger — the exact
          # protection they exist to provide has never once been active.
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          HF_API_KEY: ${{ secrets.HF_API_KEY }}
          HF_API_SECRET: ${{ secrets.HF_API_SECRET }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          # A manual run defaults to the 05:00 slot and would normally stand down because that
          # time has passed. `force` skips the wait and the slot check so a missed post can be
          # filled by hand — 2026-09-09's evening reel was lost and there was no way to publish it.
          FORCE: ${{ inputs.force && '--now' || '' }}
          CATCHUP: "${{ (github.event.schedule == '0 19 * * *' || github.event.schedule == '0 9 * * *') && '--catchup' || '' }}"
          TARGET_HOUR: ${{ contains(fromJSON('["0 5 * * *","0 6 * * *","0 7 * * *","0 8 * * *","0 9 * * *"]'), github.event.schedule) && '19' || '5' }}
        run: |
          python daily_post.py --emit --jitter 600 --hour "$TARGET_HOUR" $CATCHUP $FORCE
          # No _skip file means a reel was built and the publish steps should run.
          if [ -f output/_skip ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "this cron is not the one that posts this slot — exiting cleanly"
          fi

      - name: Host media on a GitHub Release (keeps git history lean)
        if: steps.build.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          REL="$(cat output/_path.txt)"
          FILE="post-${GITHUB_RUN_ID}.${REL##*.}"   # unique name → never collides/clobbers (IG fetch-safe)
          cp "$REL" "$FILE"
          gh release view media >/dev/null 2>&1 || gh release create media --title media --notes "hosted media"
          gh release upload media "$FILE" --clobber
          # keep only the 30 newest assets
          gh release view media --json assets -q '.assets[].name' | sort | head -n -30 \
            | while read -r a; do gh release delete-asset media "$a" -y || true; done
          echo "FILE=$FILE" >> "$GITHUB_ENV"

      # Last line of defence. The queue should make this unreachable, but a duplicate post is the
      # single most expensive thing this pipeline can ship, so the slot is re-checked after the
      # build — seconds before publishing rather than minutes.
      - name: Re-check the slot right before publishing
        id: recheck
        if: steps.build.outputs.skip != 'true'
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          TARGET_HOUR: ${{ contains(fromJSON('["0 5 * * *","0 6 * * *","0 7 * * *","0 8 * * *","0 9 * * *"]'), github.event.schedule) && '19' || '5' }}
        run: |
          # exit 1 = slot taken (skip), exit 0 = free, anything else = the check itself broke.
          # A broken check must not silently swallow the post — the queue is the real guard, so
          # fall open and publish, loudly.
          set +e
          python -c "import sys, daily_post; sys.exit(1 if daily_post.slot_already_filled(int('$TARGET_HOUR')) else 0)"
          rc=$?
          set -e
          if [ "$rc" -eq 1 ]; then
            echo "another run filled this slot while we were building — not publishing"
            echo "taken=true" >> "$GITHUB_OUTPUT"
          elif [ "$rc" -ne 0 ]; then
            echo "::warning::slot re-check failed (exit $rc) — publishing anyway, the queue still guards this"
          else
            echo "slot still free"
          fi

      - name: Publish to Instagram
        if: steps.build.outputs.skip != 'true' && steps.recheck.outputs.taken != 'true'
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
        run: |
          URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/media/${FILE}"
          echo "URL: $URL"
          CMT="$(cat output/_comment.txt)"
          if [[ "$FILE" == *.mp4 ]]; then
            python post_instagram.py "$URL" "$(cat output/_caption.txt)" --reel --comment "$CMT" --story
          else
            python post_instagram.py "$URL" "$(cat output/_caption.txt)" --comment "$CMT" --story
          fi

      # Record what we published, then re-pull insights for recent posts. Reels keep accruing
      # views for over a week, so a single fetch at publish time would freeze a near-zero —
      # `refresh` re-reads everything younger than metrics.MATURE_DAYS on every run.
      # continue-on-error: measurement must never fail a posting run.
      - name: Record performance metrics
        if: steps.build.outputs.skip != 'true' && steps.recheck.outputs.taken != 'true'
        continue-on-error: true
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
        run: |
          python metrics.py record
          python metrics.py refresh
          python metrics.py report

      # The ledger MUST survive, because a lost ledger means the next run re-posts the same
      # verse with the same scene — and Instagram demotes the whole account for duplicates, not
      # just the repeat (2026-08-26 → 잠언 18:10 published twice, reach fell ~6x and stayed down).
      # `if: always()` so a failure in an earlier step can never strand a published post with an
      # unsaved ledger. `git pull --rebase` is gone: these are machine-written JSON one-liners, a
      # concurrent bot push made git conflict on the single line, `|| true` swallowed it and left
      # the repo mid-rebase, and the push died. ledger_merge.py resolves them semantically instead.
      - name: Save no-repeat ledger
        if: always() && steps.build.outputs.skip != 'true'
        run: |
          git config user.name "malsseum-bot"
          git config user.email "malsseum-bot@users.noreply.github.com"
          cp state.json   /tmp/ours-state.json   2>/dev/null || true
          cp metrics.json /tmp/ours-metrics.json 2>/dev/null || true
          for attempt in 1 2 3 4 5; do
            git rebase --abort 2>/dev/null || true
            git fetch origin main
            git reset --hard origin/main
            for f in state metrics; do
              [ -f "/tmp/ours-$f.json" ] && python3 ledger_merge.py "/tmp/ours-$f.json" "$f.json" "$f.json"
            done
            git add state.json metrics.json || true
            git diff --cached --quiet && { echo "nothing to commit"; exit 0; }
            git commit -m "ledger update"
            if git push; then echo "ledger saved (attempt $attempt)"; exit 0; fi
            echo "push rejected — remote moved, merging again"
            sleep $((attempt * 5))
          done
          echo "::error::ledger could not be saved after 5 attempts — the next run will recover it from Instagram"
          exit 1

      # A missed post must never be silent again. Any failure/timeout opens an issue.
      - name: Alert on a missed post
        if: (failure() || cancelled()) && steps.build.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TARGET_HOUR: ${{ contains(fromJSON('["0 5 * * *","0 6 * * *","0 7 * * *","0 8 * * *","0 9 * * *"]'), github.event.schedule) && '19' || '5' }}
        run: |
          gh issue create \
            --title "missed post — ${TARGET_HOUR}:00 KST (run ${GITHUB_RUN_ID})" \
            --body "The \`${TARGET_HOUR}:00 KST\` post did not publish.

          Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}

          If the job hit the 180-min timeout, check the timing budget comment in
          \`.github/workflows/daily-post.yml\` — wait + build must fit inside it." \
            || echo "could not open issue"
          TARGET_HOUR="${TARGET_HOUR}" python notify.py \
            "❌ ${TARGET_HOUR}:00 KST 게시 실패 — ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            || true
