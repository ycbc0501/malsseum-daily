name: Reply 🙏 to comments

# Hourly (changed 2026-11-12 from */10 — RULES.md G-1/I-1). Each comment gets a target time of
# comment + 10..50 min drawn once when first seen (comment_reply.py), so the poll interval only
# decides the granularity, not the delay — this reply was never meant to be instant. The old
# */10 declaration bought nothing: GitHub throttles sub-hourly `schedule:` crons hard under load
# (its own documented behavior, and measured here 2026-11-09 — 1000 runs/86 days, median gap 48
# MIN not 10, worst 12.3h, cron_health.py's docstring), so it only ever delivered ~5-8 actual
# runs a day. The 144 PER DAY it kept declaring still counted against this repo's share of
# GitHub's shared scheduler — the same contention that was making daily-post.yml's two slots
# land hours late. Declaring an achievable hourly rate instead should both poll more reliably
# (above `schedule:` throttling's own hourly line) and leave more of that shared budget for the
# two time-critical workflows. Most runs find nothing and commit nothing either way.
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write

# A slow run must never overlap the next tick and reply twice.
concurrency:
  group: comment-reply
  cancel-in-progress: false

jobs:
  reply:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Poll comments and reply to any that are due
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
        run: python comment_reply.py

      - name: Save the reply ledger
        # One implementation for every ledger — see save_ledger.sh. The old
        # `git pull --rebase || true; git push` is what lost the 08-26 ledger.
        run: >-
          bash save_ledger.sh 'ledger: comment replies' comments.json
