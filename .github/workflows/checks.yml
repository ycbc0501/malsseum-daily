name: Checks

# Every push. The audits only help if they run without being remembered — a broken test sat in
# this repo for days because CI ran one of the five, and three of the four audits were never
# wired in at all.
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: pip install pyyaml pillow "kiwipiepy==0.24.1" imageio-ffmpeg numpy
      # ONE entry point, and it finds tests and audits by glob. Adding a check means adding the
      # file, not remembering to add a line here too.
      - name: verify
        run: bash verify.sh

      # RULES.md J-2: a red run here used to be visible only on this very page. Nothing else in
      # the repo ever pinged anyone about it — the operational alert channel (watch.py) and this
      # static-verification layer had never spoken to each other. Same channel as watch.py, no
      # cooldown: `checks` has historically passed almost every time, so one failure is a signal.
      - name: Notify on failure — otherwise this is the only place a broken rule/test is visible
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_THREAD_ID: ${{ secrets.TELEGRAM_THREAD_ID }}
        # GITHUB_REPOSITORY/SHA/SERVER_URL/RUN_ID are provided by the runner already — reading
        # them as env vars instead of ${{ }} expressions avoids mixing GitHub's templating with
        # Python string quoting inside one `run:` block (a folded `python3 -c "..."` across
        # several lines broke on exactly that mix once already — see git history on this line).
        run: python3 notify_ci_failure.py
