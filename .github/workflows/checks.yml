name: Checks

# Every push. The audits only help if they run without being remembered — a broken test sat in
# this repo for days because CI ran one of the five, and three of the four audits were never
# wired in at all.
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: pip install pyyaml pillow kiwipiepy imageio-ffmpeg
      # ONE entry point, and it finds tests and audits by glob. Adding a check means adding the
      # file, not remembering to add a line here too.
      - name: verify
        run: bash verify.sh
