name: Watch for trouble

# The engagement check rides the daily metrics backfill, but a MISSED POST has to be caught within
# a couple of hours, not the next morning. These crons are spread across the day so at least one
# lands soon after each slot's 2-hour deadline (07:00 and 21:00 KST) even with GitHub's scheduler
# running hours late — which is exactly the failure this alert exists to report.
on:
  schedule:
    - cron: "0 22 * * *"   # 07:00 KST — morning slot deadline
    - cron: "0 0 * * *"    # 09:00 KST
    - cron: "0 3 * * *"    # 12:00 KST
    - cron: "0 12 * * *"   # 21:00 KST — evening slot deadline
    - cron: "0 14 * * *"   # 23:00 KST
    - cron: "0 17 * * *"   # 02:00 KST
  workflow_dispatch:
    inputs:
      test:
        description: "Send a test alert to confirm the channel works"
        type: boolean
        default: false

# Never two at once — they share the cooldown file and would double-send.
concurrency:
  group: watch
  cancel-in-progress: false

permissions:
  contents: write
  # Read-only, for cron_health.py (RULES.md I-1) to ask GitHub's own API which OTHER scheduled
  # workflows actually fired recently. Nothing here can write to Actions.
  actions: read

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check
        env:
          # Asked of Instagram, not of the local ledger — a post that published but failed to save
          # its ledger must not be reported as missing.
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_THREAD_ID: ${{ secrets.TELEGRAM_THREAD_ID }}
          # cron_health.py — GITHUB_REPOSITORY is provided automatically by the runner;
          # GITHUB_TOKEN is not unless a step asks for it explicitly, so it is passed here.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python watch.py ${{ inputs.test && '--test' || '' }}

      - name: Remember what was already reported
        # One implementation for every ledger — see save_ledger.sh. The old
        # `git pull --rebase || true; git push` is what lost the 08-26 ledger.
        run: >-
          bash save_ledger.sh 'watch alert state' watch.json

      # RULES.md I-2: every check above, including cron_health.py, only runs if GitHub Actions
      # is scheduling THIS workflow. If GitHub stops running every scheduled workflow in this
      # repo at once — not a syntax error in one file, the whole scheduler — nothing inside the
      # repo can say so, because the thing that would say so is itself a scheduled workflow.
      # This ping is the external half: HEALTHCHECK_URL is a free dead-man's-switch (e.g.
      # healthchecks.io) that the ACCOUNT OWNER sets up once outside GitHub — see
      # notes/cron-health-2026-11-09.md. Unset by default, so skipping it breaks nothing.
      - name: Heartbeat — proves something outside GitHub noticed this run happened
        if: ${{ secrets.HEALTHCHECK_URL != '' }}
        run: curl -fsS -m 10 --retry 3 "${{ secrets.HEALTHCHECK_URL }}" >/dev/null || true
