name: Watch for trouble

# The engagement check rides the daily metrics backfill, but a MISSED POST has to be caught within
# a couple of hours, not the next morning. These crons are spread across the day so at least one
# lands soon after each slot's 1-hour deadline (GRACE_H, 06:00 and 20:00 KST — see watch.py) even
# with GitHub's own `schedule:` trigger running hours late. And since 2026-11-12 (RULES.md G-1)
# that same wake-up does not just report a miss — it fires workflow_dispatch on daily-post.yml
# itself, because `schedule:` is the slow path here (measured 270-453min late on daily-post.yml
# even with one cron per slot) while workflow_dispatch starts in ~2 seconds. No new scheduled
# trigger was added anywhere for this — it reuses the wake-ups below.
on:
  schedule:
    - cron: "0 22 * * *"   # 07:00 KST — morning slot deadline
    - cron: "0 0 * * *"    # 09:00 KST
    - cron: "0 3 * * *"    # 12:00 KST
    - cron: "0 12 * * *"   # 21:00 KST — evening slot deadline
    - cron: "0 14 * * *"   # 23:00 KST
    - cron: "0 17 * * *"   # 02:00 KST
  workflow_dispatch:
    inputs:
      test:
        description: "Send a test alert to confirm the channel works"
        type: boolean
        default: false

# Never two at once — they share the cooldown file and would double-send.
concurrency:
  group: watch
  cancel-in-progress: false

permissions:
  contents: write
  # `write`, not `read` (changed 2026-11-12) — cron_health.py (RULES.md I-1) only ever GETs
  # GitHub's API to ask which OTHER scheduled workflows fired, but
  # watch.auto_retry_missed_slots() now also POSTs a workflow_dispatch to catch up a missed
  # daily-post.yml slot (RULES.md G-1), and GitHub 403s that POST without `actions: write` even
  # though GITHUB_TOKEN is explicitly allowed to send workflow_dispatch (the one documented
  # exception to "this token's own actions don't trigger new workflow runs").
  actions: write

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check
        env:
          # Asked of Instagram, not of the local ledger — a post that published but failed to save
          # its ledger must not be reported as missing.
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_THREAD_ID: ${{ secrets.TELEGRAM_THREAD_ID }}
          # cron_health.py — GITHUB_REPOSITORY is provided automatically by the runner;
          # GITHUB_TOKEN is not unless a step asks for it explicitly, so it is passed here.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python watch.py ${{ inputs.test && '--test' || '' }}

      - name: Remember what was already reported
        # One implementation for every ledger — see save_ledger.sh. The old
        # `git pull --rebase || true; git push` is what lost the 08-26 ledger.
        # `if: always()` (added 2026-11-12) — watch.py now makes a real network POST
        # (auto_retry_missed_slots' catch-up dispatch) partway through main(), and dispatch_
        # workflow() is written to never raise, but this step existing without `always()` would
        # mean ANY future exception anywhere in main() discards this whole run's bookkeeping
        # (cooldowns, resolved failures, retried- markers) instead of just that one run's new
        # findings — the same "whatever progress this run made still gets saved" principle
        # daily-post.yml and insights.yml already follow.
        if: always()
        run: >-
          bash save_ledger.sh 'watch alert state' watch.json

      # RULES.md I-2: every check above, including cron_health.py, only runs if GitHub Actions
      # is scheduling THIS workflow. If GitHub stops running every scheduled workflow in this
      # repo at once — not a syntax error in one file, the whole scheduler — nothing inside the
      # repo can say so, because the thing that would say so is itself a scheduled workflow.
      # This ping is the external half: HEALTHCHECK_URL is a free dead-man's-switch (e.g.
      # healthchecks.io) that the ACCOUNT OWNER sets up once outside GitHub — see
      # notes/cron-health-2026-11-09.md. Unset by default, so skipping it breaks nothing.
      - name: Heartbeat — proves something outside GitHub noticed this run happened
        # `secrets` cannot be read directly inside an `if:` expression (GitHub Actions rejects
        # it at parse time — "Unrecognized named-value: 'secrets'"). Route it through `env:`
        # first, which both the `if:` and the `run:` step can read from.
        if: ${{ env.HEALTHCHECK_URL != '' }}
        env:
          HEALTHCHECK_URL: ${{ secrets.HEALTHCHECK_URL }}
        run: curl -fsS -m 10 --retry 3 "$HEALTHCHECK_URL" >/dev/null || true
