name: Collect insights

# 03:20 KST daily (18:20 UTC) — after both of the day's posts have had time to settle.
on:
  schedule:
    - cron: "20 18 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  insights:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Collect per-post metrics and print the report
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
        run: python insights.py

      - name: Save the insights ledger
        run: |
          git config user.name "malsseum-bot"
          git config user.email "malsseum-bot@users.noreply.github.com"
          git add insights.json
          git commit -m "insights: daily metrics" || { echo "nothing to commit"; exit 0; }
          git pull --rebase --autostash origin main || true
          git push
