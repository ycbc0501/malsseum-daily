name: Backfill metrics + followers

# 03:20 KST daily (18:20 UTC) — after both of the day's posts have had time to settle.
on:
  schedule:
    - cron: "20 18 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  insights:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Backfill metrics.json, record followers, print the report
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          # Read-only Instagram-login token. When present it is used instead of the publishing
          # token, because only it can carry the insights scope. Absent → falls back silently.
          IG_INSIGHTS_TOKEN: ${{ secrets.IG_INSIGHTS_TOKEN }}
        run: python insights.py

      # Once a month, ask the API about every single name in ig_catalog.py and write the
      # verdict to api_support.json. This is the only thing that keeps "what is automatic" from
      # drifting back into something decided from memory: several catalogued metrics are
      # documented "in development" and will start answering with no announcement, and a token
      # gaining the insights scope changes thirty rows at once. ~85 calls, on the 1st only.
      - name: Re-probe what the API will answer (monthly)
        continue-on-error: true
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_INSIGHTS_TOKEN: ${{ secrets.IG_INSIGHTS_TOKEN }}
          META_APP_ID: ${{ secrets.META_APP_ID }}
          META_APP_SECRET: ${{ secrets.META_APP_SECRET }}
        run: python ig_probe.py --if-stale

      # Silent unless something is actually wrong. A daily "it posted" message was noise; this
      # only speaks when engagement falls off a cliff, posts stop, or several in a row get no
      # response at all. Backtested against the August collapse: no false alarm on any healthy
      # day, first alert 08-29 — eight days before it was noticed by eye.
      - name: Watch for a drop
        continue-on-error: true
        env:
          # watch.py asks Instagram which slots actually published — without these it falls back to
          # metrics.json and would report a post as missing when its ledger push failed.
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python watch.py

      - name: Save the ledgers
        # One implementation for every ledger — see save_ledger.sh. The old
        # `git pull --rebase || true; git push` is what lost the 08-26 ledger.
        run: >-
          bash save_ledger.sh 'ledgers: metrics + followers + account'
          metrics.json metrics_deleted.json state.json followers.json watch.json
          account.json api_support.json
