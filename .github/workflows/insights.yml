name: Backfill metrics + followers

# 03:20 KST daily (18:20 UTC) — after both of the day's posts have had time to settle.
on:
  schedule:
    - cron: "20 18 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  insights:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Backfill metrics.json, record followers, print the report
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          # Read-only Instagram-login token. When present it is used instead of the publishing
          # token, because only it can carry the insights scope. Absent → falls back silently.
          IG_INSIGHTS_TOKEN: ${{ secrets.IG_INSIGHTS_TOKEN }}
        run: python insights.py

      - name: Save the ledgers
        run: |
          git config user.name "malsseum-bot"
          git config user.email "malsseum-bot@users.noreply.github.com"
          git add metrics.json followers.json
          git commit -m "metrics: daily backfill + follower curve" || { echo "nothing to commit"; exit 0; }
          git pull --rebase --autostash origin main || true
          git push
